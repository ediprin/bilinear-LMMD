data:
  root: data/sni-instance-crops
  dataset_format: sni_manifest_v2
  manifest_root: data/sni-classification-v3
  image_size: 224
  batch_size: 32
  workers: 2
  augmentation_mode: standard
  manifest_weight_column: train_weight_group_class_equal
model:
  backbone: swin_tiny_patch4_window7_224.ms_in1k
  pretrained: true
  head: swin_hssam
  num_classes: 15
  out_indices: [1, 2, 3]
  hsfpn_channels: 256
  sam_hidden_dim: 128
  classifier: linear
adaptation:
  method: source_only
training:
  epochs: 50
  precision: amp_fp16
  channels_last: false
  non_blocking: true
  classification_loss: fusion_ce_focal
  fusion_loss_alpha: 0.25
  fusion_loss_gamma: 2.0
  fusion_loss_ce_weight: 0.7
  fusion_loss_focal_weight: 0.3
  output_dir: outputs/S3J1_swin_hssam_group_primary
evaluation:
  selection_metric: source_group_class_macro_f1
  hard_groups:
    black_variant: [biji_hitam, biji_hitam_pecah, biji_hitam_sebagian]
    hole_count: [biji_berlubang_satu, biji_berlubang_lebih_satu]
    subtle_condition: [biji_bertutul_tutul, biji_coklat, biji_muda]
