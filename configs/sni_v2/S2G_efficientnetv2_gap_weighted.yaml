data:
  dataset_format: sni_manifest_v2
  image_size: 224
  batch_size: 32
  workers: 4
  augmentation_mode: standard
  manifest_weight_column: train_weight_inverse_sqrt
model:
  backbone: tf_efficientnetv2_b0.in1k
  pretrained: true
  head: gap
  num_classes: 15
  out_indices: [4]
  classifier: linear
adaptation:
  method: source_only
training:
  epochs: 50
  precision: amp_fp16
  channels_last: true
  non_blocking: true
  classification_loss: cross_entropy
  output_dir: outputs/S2G_efficientnetv2_gap_weighted
evaluation:
  hard_groups:
    black_variant: [biji_hitam, biji_hitam_pecah, biji_hitam_sebagian]
    hole_count: [biji_berlubang_satu, biji_berlubang_lebih_satu]
    subtle_condition: [biji_bertutul_tutul, biji_coklat, biji_muda]
